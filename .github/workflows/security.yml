name: Security & tests

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 1' # weekly, catches newly disclosed CVEs

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the secret scan
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=low
      - name: Secret scan (working tree + full git history)
        run: npm run scan:secrets
      - name: Tests (incl. security regression tests)
        run: npm test

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
